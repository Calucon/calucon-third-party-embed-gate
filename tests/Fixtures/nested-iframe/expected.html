<!-- The expected output keeps one orphan </iframe>: the outer span ends at
     the first closer, and browsers silently drop the stray end tag. What
     matters is that no attribute fragments leak and later content survives. -->
<p>Hand-written widget markup with an iframe nested as its own fallback:</p>
<div class="cg-embed" role="group" aria-label="Embedded content from Google Maps" data-cg-provider="google-maps" data-cg-host="www.google.com" style="--cg-aspect:560/315"><script type="application/json" class="cg-embed__payload">{"src":"https://www.google.com/maps/embed?pb=!1m14!1m8","attrs":{"title":"Outer map","width":"560","height":"315"}}</script><div class="cg-embed__panel"><p class="cg-embed__note">Loading this map contacts Google Maps, which receives your IP address and which page you are on, and sets cookies.</p><button type="button" class="cg-embed__button">Load map from Google Maps</button><p class="cg-embed__fallback"><a href="https://www.google.com/maps/embed?pb=!1m14!1m8" rel="noopener nofollow">Open on Google Maps</a></p></div></div></iframe>
<p>Text after both closers must survive unharmed.</p>
