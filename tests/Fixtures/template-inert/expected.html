<p>A carousel plugin ships its slide markup in an inert template:</p>
<template id="slide-embed"><iframe title="Kolkja Cycling" width="560" height="315" src="https://www.youtube.com/embed/y_pjE_p1HwE" frameborder="0"></iframe></template>
