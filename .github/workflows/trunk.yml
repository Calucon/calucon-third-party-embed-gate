# The `trunk` branch mirrors WordPress.org's SVN **trunk**, and this workflow
# keeps the two in step: every merge into `trunk` syncs SVN trunk and publishes
# a GitHub pre-release `v{VERSION}-rc.N`. It never creates an SVN tag and never
# changes what users are served — releases stay with release.yml, which runs
# when `trunk` is merged into `main`.
#
# Why trunk is synced before a release: translate.wordpress.org builds its
# "Development" and "Development Readme" projects from SVN trunk. Syncing it
# makes wordpress.org re-parse the readme and the plugin strings, so the German
# (or any other locale) can be translated and inspected on GlotPress *before*
# the text becomes the Stable version that users and the public plugin page
# see. The release candidate is the same build as a downloadable zip.
#
# Two ways to run it:
#   - automatically, on every push to `trunk` (i.e. every merge into it):
#     syncs SVN trunk AND publishes the release candidate;
#   - by hand (Actions → Trunk → Run workflow), from any ref: syncs SVN trunk
#     only, and defaults to a dry run that shows the diff and commits nothing.
#     Use it to preview a sync or to refresh trunk without a merge.
#
# ---------------------------------------------------------------------------
# The one thing that could hurt users, and how this avoids it
# ---------------------------------------------------------------------------
# WordPress.org decides which version to serve from the `Stable tag:` line in
# **trunk's** readme.txt. The handbook's own warning about the tagging dance is
# "updating to the wrong stable tag and pushing bad code to users".
#
# This branch's readme.txt names the version being developed, which has no tag
# on wordpress.org yet. Copying it into trunk verbatim would therefore point
# the directory at a version that does not exist.
#
# So this workflow never writes that line. It reads `Stable tag:` out of the
# trunk readme that is already live, restores it into the readme it uploads,
# and refuses to commit unless that tag actually exists under /tags. Whatever
# wordpress.org was serving before the run, it serves after it.
#
# Requires the same opt-in as the release deploy: vars.WPORG_DEPLOY=true and
# the SVN_USERNAME / SVN_PASSWORD secrets.
name: Trunk

on:
  push:
    branches: [trunk]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — show the diff, commit nothing'
        type: boolean
        default: true
      reason:
        description: 'Why (recorded in the SVN commit message)'
        type: string
        required: true
        default: 'refresh trunk so translate.wordpress.org re-parses the readme'

# contents: write is for the release candidate (a tag and a pre-release). The
# SVN side authenticates with the secrets, not with this token.
permissions:
  contents: write

# Shares the release workflow's lock: two things writing this SVN repo at once
# is a confusing failure, and neither is urgent enough to race.
concurrency:
  group: release
  cancel-in-progress: false

env:
  # `inputs.*` is empty on a push event, so `!inputs.dry_run` would be true
  # there by accident. Spell the condition out: a dry run is a manual run
  # with the box ticked, and nothing else.
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}

jobs:
  trunk:
    name: Sync trunk + release candidate
    runs-on: ubuntu-latest
    if: ${{ vars.WPORG_DEPLOY == 'true' }}
    env:
      SLUG: calucon-third-party-embed-gate
      SVN_URL: https://plugins.svn.wordpress.org/calucon-third-party-embed-gate
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v4

      # Trunk is public and gets parsed for the plugin directory the moment it
      # lands, so it should not be a state the suite rejects.
      - name: Unit + fixture suite (PHPUnit)
        run: composer test

      - name: Build the shipped file set
        run: bash bin/build-zip.sh > /dev/null && ls build/${{ env.SLUG }}

      # ubuntu-latest no longer ships Subversion. The release workflow does not
      # need this step because 10up/action-wordpress-plugin-deploy installs svn
      # itself; this workflow drives svn directly, so it has to do the same.
      - name: Install Subversion
        run: |
          if ! command -v svn > /dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y subversion
          fi
          svn --version --quiet

      - name: Check out SVN trunk
        run: |
          svn checkout --depth immediates "$SVN_URL" svn
          svn update --set-depth infinity svn/trunk

      - name: Read the live stable tag, and prove it exists
        id: stable
        run: |
          LIVE=$(grep -m1 -i '^Stable tag:' svn/trunk/readme.txt | sed -E 's/^[Ss]table tag:[[:space:]]*//' | tr -d '[:space:]')
          if [ -z "$LIVE" ]; then
            echo "::error::trunk/readme.txt has no Stable tag line — refusing to guess." && exit 1
          fi
          if [ "$LIVE" = "trunk" ]; then
            echo "::error::trunk/readme.txt uses 'Stable tag: trunk'. This workflow would then publish trunk to every user. Set a version first." && exit 1
          fi
          if ! svn ls "$SVN_URL/tags/$LIVE" > /dev/null 2>&1; then
            echo "::error::Stable tag is $LIVE but $SVN_URL/tags/$LIVE does not exist. Fix that before pushing trunk." && exit 1
          fi
          echo "live=$LIVE" >> "$GITHUB_OUTPUT"
          echo "wordpress.org is serving $LIVE, and it will still be serving $LIVE after this run."

      - name: Copy the build into trunk
        run: |
          # --exclude .svn is not optional: --delete would otherwise remove the
          # working-copy metadata and every later svn command would fail.
          rsync -a --delete --exclude '.svn/' "build/$SLUG/" svn/trunk/

      # The single line this workflow must not change.
      - name: Restore the live stable tag
        run: |
          LIVE='${{ steps.stable.outputs.live }}'
          sed -i -E "s/^[Ss]table tag:.*/Stable tag: ${LIVE}/" svn/trunk/readme.txt
          grep -m1 -i '^Stable tag:' svn/trunk/readme.txt

      - name: Stage adds and deletes
        working-directory: svn
        run: |
          svn add --force trunk --auto-props --parents --depth infinity -q
          svn status trunk | grep '^!' | sed 's/^! *//' | xargs -r -I{} svn rm --force '{}@' -q
          svn status trunk

      - name: Show what would change
        working-directory: svn
        run: |
          echo '--- readme.txt ---'
          svn diff trunk/readme.txt || true
          echo '--- everything else (summary) ---'
          svn diff --summarize trunk || true

      - name: Commit
        if: ${{ env.DRY_RUN != 'true' }}
        working-directory: svn
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          # Through the environment, never interpolated into the script: a
          # dispatch input or a commit message expanded inline is a
          # shell-injection hole, however short the list of people who can
          # dispatch or merge. On a push the reason is the merge commit's
          # subject line.
          REASON: ${{ inputs.reason || github.event.head_commit.message }}
          LIVE: ${{ steps.stable.outputs.live }}
        run: |
          REASON="${REASON%%$'\n'*}"
          svn commit trunk \
            --username "$SVN_USERNAME" --password "$SVN_PASSWORD" \
            --no-auth-cache --non-interactive \
            -m "Update trunk from ${GITHUB_SHA::8}: ${REASON} (stable stays ${LIVE})"

      # Release candidate: one pre-release per merge into trunk, numbered per
      # version from the rc tags already on origin (max + 1, so a hand-deleted
      # rc.2 between rc.1 and rc.3 cannot be minted twice). Skipped when
      # v{VERSION} is already a release — a docs-only or infra merge after a
      # release has nothing to be a candidate for; bump the version first.
      # Only on push: a manual run can come from any ref and is the
      # "sync SVN trunk only" path.
      - name: Determine the release-candidate tag
        id: rc
        if: ${{ github.event_name == 'push' }}
        run: |
          VERSION=$(bash bin/plugin-version.sh)
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" > /dev/null 2>&1; then
            echo "::notice::v${VERSION} is already released. Trunk was synced, but no release candidate is published for a released version — bump the Version header, the constant and the Stable tag to get one."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          LAST=$(git ls-remote --refs --tags origin "refs/tags/v${VERSION}-rc.*" \
            | sed -nE 's/.*-rc\.([0-9]+)$/\1/p' | sort -n | tail -n1)
          N=$(( ${LAST:-0} + 1 ))
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}-rc.${N}" >> "$GITHUB_OUTPUT"
          echo "Release candidate: v${VERSION}-rc.${N}"

      - name: Publish the release candidate
        if: ${{ github.event_name == 'push' && steps.rc.outputs.skip == 'false' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.rc.outputs.tag }}
          name: Calucon Third-Party Embed Gate ${{ steps.rc.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          generate_release_notes: true
          files: build/calucon-third-party-embed-gate-${{ steps.rc.outputs.version }}.zip

      - name: Where to look next
        run: |
          if [ "$DRY_RUN" = 'true' ]; then
            echo '### Dry run — nothing was committed' >> "$GITHUB_STEP_SUMMARY"
            echo 'Re-run with **Dry run** unchecked to push trunk.' >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo '### Trunk updated'
              echo ''
              echo "Stable stays at **${{ steps.stable.outputs.live }}** — users are unaffected."
              echo ''
              if [ '${{ steps.rc.outputs.skip }}' = 'false' ]; then
                echo "Release candidate: **${{ steps.rc.outputs.tag }}** (pre-release, with the zip)."
                echo ''
              fi
              echo 'wordpress.org re-parses trunk within a few minutes. Inspect the regenerated strings:'
              echo ''
              echo "- [Development Readme](https://translate.wordpress.org/projects/wp-plugins/$SLUG/dev-readme/de/default/)"
              echo "- [Development](https://translate.wordpress.org/projects/wp-plugins/$SLUG/dev/de/default/)"
              echo ''
              echo 'When the translations are right, open the release: `gh pr create --base main --head trunk` and merge it with **Create a merge commit**.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
