# Push the current branch to the WordPress.org SVN **trunk**, and nothing else.
#
# Why this exists: translate.wordpress.org builds its "Development" and
# "Development Readme" projects from trunk. Pushing trunk makes wordpress.org
# re-parse the readme and the plugin strings, so the German (or any other
# locale) can be translated and inspected on GlotPress *before* the text
# becomes the Stable version that users and the public plugin page see.
#
# It does NOT create a tag and does NOT release anything. Releases stay with
# release.yml, which runs on merges to main and deploys trunk + a version tag.
#
# ---------------------------------------------------------------------------
# The one thing that could hurt users, and how this avoids it
# ---------------------------------------------------------------------------
# WordPress.org decides which version to serve from the `Stable tag:` line in
# **trunk's** readme.txt. The handbook's own warning about the tagging dance is
# "updating to the wrong stable tag and pushing bad code to users".
#
# This branch's readme.txt names the version being developed, which has no tag
# on wordpress.org yet. Copying it into trunk verbatim would therefore point
# the directory at a version that does not exist.
#
# So this workflow never writes that line. It reads `Stable tag:` out of the
# trunk readme that is already live, restores it into the readme it uploads,
# and refuses to commit unless that tag actually exists under /tags. Whatever
# wordpress.org was serving before the run, it serves after it.
#
# Requires the same opt-in as the release deploy: vars.WPORG_DEPLOY=true and
# the SVN_USERNAME / SVN_PASSWORD secrets.
name: Push trunk to WordPress.org

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — show the diff, commit nothing'
        type: boolean
        default: true
      reason:
        description: 'Why (recorded in the SVN commit message)'
        type: string
        required: true
        default: 'refresh trunk so translate.wordpress.org re-parses the readme'

permissions:
  contents: read

# Shares the release workflow's lock: two things writing this SVN repo at once
# is a confusing failure, and neither is urgent enough to race.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  trunk:
    name: Deploy trunk only
    runs-on: ubuntu-latest
    if: ${{ vars.WPORG_DEPLOY == 'true' }}
    env:
      SLUG: calucon-third-party-embed-gate
      SVN_URL: https://plugins.svn.wordpress.org/calucon-third-party-embed-gate
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v3

      # Trunk is public and gets parsed for the plugin directory the moment it
      # lands, so it should not be a state the suite rejects.
      - name: Unit + fixture suite (PHPUnit)
        run: composer test

      - name: Build the shipped file set
        run: bash bin/build-zip.sh > /dev/null && ls build/${{ env.SLUG }}

      - name: Check out SVN trunk
        run: |
          svn checkout --depth immediates "$SVN_URL" svn
          svn update --set-depth infinity svn/trunk

      - name: Read the live stable tag, and prove it exists
        id: stable
        run: |
          LIVE=$(grep -m1 -i '^Stable tag:' svn/trunk/readme.txt | sed -E 's/^[Ss]table tag:[[:space:]]*//' | tr -d '[:space:]')
          if [ -z "$LIVE" ]; then
            echo "::error::trunk/readme.txt has no Stable tag line — refusing to guess." && exit 1
          fi
          if [ "$LIVE" = "trunk" ]; then
            echo "::error::trunk/readme.txt uses 'Stable tag: trunk'. This workflow would then publish trunk to every user. Set a version first." && exit 1
          fi
          if ! svn ls "$SVN_URL/tags/$LIVE" > /dev/null 2>&1; then
            echo "::error::Stable tag is $LIVE but $SVN_URL/tags/$LIVE does not exist. Fix that before pushing trunk." && exit 1
          fi
          echo "live=$LIVE" >> "$GITHUB_OUTPUT"
          echo "wordpress.org is serving $LIVE, and it will still be serving $LIVE after this run."

      - name: Copy the build into trunk
        run: |
          # --exclude .svn is not optional: --delete would otherwise remove the
          # working-copy metadata and every later svn command would fail.
          rsync -a --delete --exclude '.svn/' "build/$SLUG/" svn/trunk/

      # The single line this workflow must not change.
      - name: Restore the live stable tag
        run: |
          LIVE='${{ steps.stable.outputs.live }}'
          sed -i -E "s/^[Ss]table tag:.*/Stable tag: ${LIVE}/" svn/trunk/readme.txt
          grep -m1 -i '^Stable tag:' svn/trunk/readme.txt

      - name: Stage adds and deletes
        working-directory: svn
        run: |
          svn add --force trunk --auto-props --parents --depth infinity -q
          svn status trunk | grep '^!' | sed 's/^! *//' | xargs -r -I{} svn rm --force '{}@' -q
          svn status trunk

      - name: Show what would change
        working-directory: svn
        run: |
          echo '--- readme.txt ---'
          svn diff trunk/readme.txt || true
          echo '--- everything else (summary) ---'
          svn diff --summarize trunk || true

      - name: Commit
        if: ${{ !inputs.dry_run }}
        working-directory: svn
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          # Through the environment, never interpolated into the script: a
          # dispatch input expanded inline is a shell-injection hole, however
          # short the list of people who can dispatch it.
          REASON: ${{ inputs.reason }}
          LIVE: ${{ steps.stable.outputs.live }}
        run: |
          svn commit trunk \
            --username "$SVN_USERNAME" --password "$SVN_PASSWORD" \
            --no-auth-cache --non-interactive \
            -m "Update trunk from ${GITHUB_SHA::8}: ${REASON} (stable stays ${LIVE})"

      - name: Where to look next
        run: |
          if [ '${{ inputs.dry_run }}' = 'true' ]; then
            echo '### Dry run — nothing was committed' >> "$GITHUB_STEP_SUMMARY"
            echo 'Re-run with **Dry run** unchecked to push trunk.' >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo '### Trunk updated'
              echo ''
              echo "Stable stays at **${{ steps.stable.outputs.live }}** — users are unaffected."
              echo ''
              echo 'wordpress.org re-parses trunk within a few minutes. Inspect the regenerated strings:'
              echo ''
              echo "- [Development Readme](https://translate.wordpress.org/projects/wp-plugins/$SLUG/dev-readme/de/default/)"
              echo "- [Development](https://translate.wordpress.org/projects/wp-plugins/$SLUG/dev/de/default/)"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
