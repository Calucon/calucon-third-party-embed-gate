# Build and publish a release with the installable plugin zip on every push
# to main (i.e. every merge).
#
# The tag comes from the Version header in calucon-third-party-embed-gate.php: v0.1.0 for the
# first merge at that version. If that tag already exists (a merge without a
# version bump), the release is still created, as v0.1.0-build.<run number>,
# so every merge yields a downloadable zip. Bump the Version header to cut a
# clean vX.Y.Z.
#
# The unit suite runs again here as a backstop: branch protection guards PR
# merges, this guards direct pushes.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Package and release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v4

      - name: Unit + fixture suite (PHPUnit)
        run: composer test

      - name: Determine version and tag
        id: version
        run: |
          VERSION=$(bash bin/plugin-version.sh)
          if [ -z "$VERSION" ]; then
            echo "Could not read the Version header from calucon-third-party-embed-gate.php" >&2
            exit 1
          fi
          TAG="v${VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" > /dev/null 2>&1; then
            TAG="v${VERSION}-build.${{ github.run_number }}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build plugin zip
        run: bash bin/build-zip.sh

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Calucon Third-Party Embed Gate ${{ steps.version.outputs.tag }}
          files: build/calucon-third-party-embed-gate-${{ steps.version.outputs.version }}.zip
          generate_release_notes: true

  # WordPress.org SVN deploy. Kept in THIS workflow rather than a separate one
  # triggered by `release: published`, because GitHub does not fire release/tag
  # events created with the default GITHUB_TOKEN (as the release job above does)
  # — a standalone deploy workflow would silently never run. Inert until the
  # plugin is approved and the maintainer opts in: sets vars.WPORG_DEPLOY=true
  # and adds the SVN_USERNAME/SVN_PASSWORD secrets. Deploys trunk + a version
  # tag and syncs .wordpress-org/ to the SVN /assets directory; the shipped set
  # is the inverse of .distignore. See .github/WORDPRESS-ORG-SUBMISSION.md.
  deploy:
    name: Deploy to WordPress.org
    needs: release
    if: ${{ vars.WPORG_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Deploy to WordPress.org SVN
        uses: 10up/action-wordpress-plugin-deploy@2.3.0
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: calucon-third-party-embed-gate
          VERSION: ${{ needs.release.outputs.version }}
