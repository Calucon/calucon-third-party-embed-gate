# Build and publish a release with the installable plugin zip on every push
# to main (i.e. every merge).
#
# main only ever receives `trunk` (main-gate.yml refuses anything else), and
# every merge into it IS a release: the tag comes from the Version header in
# calucon-third-party-embed-gate.php, and that version must not be tagged
# yet. The "Version is unreleased" gate checks that before the merge; this
# workflow checks it again and fails hard rather than minting a second
# release for the same version. There is no -build.N fallback any more.
#
# The release candidates trunk.yml published for this version
# (v{VERSION}-rc.N pre-releases) are deleted here, before the release is
# created, so the generated notes start from the previous release and the
# release list ends up with one entry per version.
#
# The unit suite runs again here as a backstop: branch protection guards PR
# merges, this guards direct pushes.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Package and release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v4

      - name: Unit + fixture suite (PHPUnit)
        run: composer test

      - name: Determine version and tag
        id: version
        run: |
          VERSION=$(bash bin/plugin-version.sh)
          if [ -z "$VERSION" ]; then
            echo "Could not read the Version header from calucon-third-party-embed-gate.php" >&2
            exit 1
          fi
          TAG="v${VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" > /dev/null 2>&1; then
            echo "::error::${TAG} already exists. main only takes bumped versions — the 'Version is unreleased' gate should have caught this. Bump the version on trunk and open a new release PR." >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build plugin zip
        run: bash bin/build-zip.sh

      # The rc tag's release may be missing if trunk.yml failed between the
      # tag and the release; the fallback deletes the bare tag.
      - name: Remove the release candidates for this version
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git ls-remote --refs --tags origin "refs/tags/v${VERSION}-rc.*" \
            | sed -E 's|.*refs/tags/||' | while read -r tag; do
              echo "Deleting pre-release ${tag}"
              gh release delete "$tag" --cleanup-tag --yes || git push origin --delete "$tag"
            done

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Calucon Third-Party Embed Gate ${{ steps.version.outputs.tag }}
          files: build/calucon-third-party-embed-gate-${{ steps.version.outputs.version }}.zip
          generate_release_notes: true

  # WordPress.org SVN deploy. Kept in THIS workflow rather than a separate one
  # triggered by `release: published`, because GitHub does not fire release/tag
  # events created with the default GITHUB_TOKEN (as the release job above does)
  # — a standalone deploy workflow would silently never run. Inert until the
  # maintainer opts in: sets vars.WPORG_DEPLOY=true and adds the
  # SVN_USERNAME/SVN_PASSWORD secrets. Deploys trunk + a version tag and syncs
  # .wordpress-org/ to the SVN /assets directory. The shipped set is the zip's
  # (BUILD_DIR = bin/build-zip.sh's staging directory), so SVN, the GitHub
  # release and the trunk sync in trunk.yml carry identical files — the
  # .distignore route shipped one file the zip strips. See
  # .github/WORDPRESS-ORG-SUBMISSION.md.
  deploy:
    name: Deploy to WordPress.org
    needs: release
    if: ${{ vars.WPORG_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build the shipped file set
        run: bash bin/build-zip.sh > /dev/null && ls build/calucon-third-party-embed-gate

      - name: Deploy to WordPress.org SVN
        uses: 10up/action-wordpress-plugin-deploy@2.3.0
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: calucon-third-party-embed-gate
          VERSION: ${{ needs.release.outputs.version }}
          BUILD_DIR: build/calucon-third-party-embed-gate
