# Unit tests + coding standards + E2E/axe + real-WordPress integration on
# every pull request and on main (PLAN.md §11: lint → unit → E2E → axe,
# block merge on any failure).
#
# To make merging impossible while tests fail, require these checks under
# Settings > Branches (or Rulesets) for main:
#   "PHP 7.4 lint + unit tests", "PHP 8.4 lint + unit tests",
#   "E2E + axe (Chromium)", "WordPress integration (Playground)"
# GitHub only offers a check for selection after it has run at least once.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  php:
    name: PHP ${{ matrix.php }} lint + unit tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The plugin declares "Requires PHP: 7.4" — test the floor and current.
        php: ['7.4', '8.4']
    steps:
      - uses: actions/checkout@v5

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v4

      - name: Coding standards (PHPCS, WordPress-Extra + PHPCompatibilityWP)
        run: composer lint

      - name: Unit + fixture suite (PHPUnit)
        run: composer test

  e2e:
    # The zero-requests spec is the product claim in executable form
    # (PLAN.md §10.3); the axe sweep is what lets readme.txt say "zero
    # axe-core violations in CI" truthfully.
    name: E2E + axe (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v4

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E + axe suite
        run: npm run test:e2e

  wp:
    # Real WordPress (Playground, PHP-WASM + SQLite): the integration
    # surface — hooks, editing-context bails, REST behaviour, admin screen.
    name: WordPress integration (Playground)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: WordPress integration suite
        run: npm run test:wp

  wp-old:
    # The same suite against the OLDEST WordPress this plugin claims to
    # support, and against the version where translation loading changed.
    #
    # Playground only serves current WordPress, so this one uses the Docker
    # backend. It exists because a whole class of bug is invisible on a
    # current install: bundled translations were silently ignored below 6.8,
    # and the suite was green throughout, because modern WordPress finds them
    # by a route the old versions do not have. "Requires at least: 5.9" is a
    # promise; this is what keeps it one.
    #
    # 6.7 is not arbitrary. Its release notes are the ones about translation
    # loading, which makes it the version everyone assumes fixed this — and
    # measurably it did not. If that boundary ever moves, this job is where
    # it shows up.
    name: WordPress ${{ matrix.wp }} (Docker)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - wp: '5.9'
            php: '7.4'
          - wp: '6.7'
            php: '8.2'
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start WordPress ${{ matrix.wp }}
        env:
          CG_WP_IMAGE: wordpress:${{ matrix.wp }}-php${{ matrix.php }}-apache
          CG_WP_CLI_IMAGE: wordpress:cli-php${{ matrix.php }}
        run: bash tests/wp/setup.sh

      - name: WordPress integration suite
        env:
          WP_BASE_URL: http://127.0.0.1:8890
        run: npm run test:wp

      - name: Tear down
        if: always()
        run: bash tests/wp/teardown.sh
