# Deploys a published release to the WordPress.org SVN repository.
#
# INERT until the plugin is approved AND you opt in:
#   1. WordPress.org approves the plugin and creates its SVN repo
#      (slug: consent-gate).
#   2. Add repository secrets  SVN_USERNAME  and  SVN_PASSWORD  (your
#      WordPress.org account).
#   3. Set repository variable  WPORG_DEPLOY = true.
# Until step 3, the job is skipped, so releases never fail on a missing SVN
# repo or missing secrets. See .github/WORDPRESS-ORG-SUBMISSION.md.
#
# On each published release it deploys trunk + a version tag and syncs the
# .wordpress-org/ assets (icons, screenshots) to the SVN /assets directory.
# The shipped file set is the inverse of .distignore (dev tooling, tests,
# CI and repo docs are excluded).
name: Deploy to WordPress.org

on:
  release:
    types: [ published ]
  workflow_dispatch:

jobs:
  deploy:
    name: SVN deploy
    runs-on: ubuntu-latest
    if: ${{ vars.WPORG_DEPLOY == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to WordPress.org
        uses: 10up/action-wordpress-plugin-deploy@2.3.0
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: consent-gate
